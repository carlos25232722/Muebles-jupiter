<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebles Júpiter - Contacto</title>
</head>
<body>

    <header>
        <h1>Muebles Júpiter</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo de Muebles</a></li>
                <li><a href="contactos.html">Solicitar Cotización</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Solicita una Cotización o Restauración</h2>
            <form>
                <div>
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <br>
                <div>
                    <label for="correo">Correo electrónico:</label><br>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <br>
                <div>
                    <label for="servicio">¿Qué servicio o mueble necesitas?</label><br>
                    <select id="servicio" name="servicio">
                        <option value="mueble-nuevo">Comprar mueble catálogo</option>
                        <option value="restauracion">Restauración de mueble</option>
                        <option value="medida">Diseño a la medida</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="mensaje">Detalles de la solicitud:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="4" cols="30"></textarea>
                </div>
                <br>
                <button type="submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p><strong>Muebles Júpiter</strong> - Taller y Tienda de Muebles</p>
        <p>Contacto: contacto@mueblesjupiter.com | Teléfono: +57 300 000 0000</p>
        <p>&copy; 2026 Muebles Júpiter. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
